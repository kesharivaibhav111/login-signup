<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Modern login and signup page with interactive mascot characters." />
  <title>Welcome Back — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg-left: #f0eee9;
      --bg-right: #ffffff;
      --text-primary: #1a1a1a;
      --text-secondary: #6b7280;
      --border: #e0e0e0;
      --border-focus: #1a1a1a;
      --accent: #1a1a1a;
      --radius: 12px;
      --radius-sm: 8px;
      --shadow-input: 0 1px 3px rgba(0,0,0,.06);
      --shadow-btn: 0 1px 2px rgba(0,0,0,.08);
      --transition: .3s ease;
      --font: 'Inter', system-ui, -apple-system, sans-serif;
      --purple: #8b5cf6;
      --orange: #f97316;
      --yellow: #facc15;
      --teal: #2dd4bf;
    }
    html { font-size: 16px; }
    body {
      font-family: var(--font);
      color: var(--text-primary);
      min-height: 100dvh;
      display: flex;
      background: var(--bg-right);
      overflow-x: hidden;
    }
    .split { display: flex; width: 100%; min-height: 100dvh; }
    .left-panel {
      flex: 1 1 50%;
      background: var(--bg-left);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      padding: 2rem;
    }
    .right-panel {
      flex: 1 1 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .characters-scene {
      position: relative;
      width: 400px;
      height: 380px;
    }
    .character {
      position: absolute;
      transition: transform var(--transition);
    }
    .char-purple {
      width: 100px;
      height: 130px;
      background: var(--purple);
      border-radius: 18px;
      left: 40px;
      bottom: 60px;
    }
    .char-purple .eyes { top: 30px; left: 50%; transform: translateX(-50%); }
    .char-orange {
      width: 120px;
      height: 60px;
      background: var(--orange);
      border-radius: 60px 60px 0 0;
      right: 50px;
      bottom: 60px;
    }
    .char-orange .eyes { top: 14px; left: 50%; transform: translateX(-50%); }
    .char-yellow {
      width: 90px;
      height: 120px;
      background: var(--yellow);
      border-radius: 45px 45px 0 0;
      left: 160px;
      bottom: 60px;
    }
    .char-yellow .eyes { top: 30px; left: 50%; transform: translateX(-50%); }
    .char-teal {
      width: 70px;
      height: 70px;
      background: var(--teal);
      border-radius: 50%;
      right: 80px;
      bottom: 140px;
    }
    .char-teal .eyes { top: 20px; left: 50%; transform: translateX(-50%); }
    .ground {
      position: absolute;
      bottom: 58px;
      left: 20px;
      right: 20px;
      height: 3px;
      background: #d5d0c8;
      border-radius: 2px;
    }
    .eyes {
      position: absolute;
      display: flex;
      gap: 10px;
      pointer-events: none;
    }
    .eye {
      width: 16px;
      height: 16px;
      background: #fff;
      border-radius: 50%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: visible;
      transition: background .3s ease;
    }
    .pupil {
      width: 7px;
      height: 7px;
      background: var(--text-primary);
      border-radius: 50%;
      position: absolute;
      transition: transform 0.08s ease-out, opacity .25s ease;
    }
    .eye::before,
    .eye::after {
      content: '';
      position: absolute;
      width: 9px;
      height: 2.5px;
      background: #fff;
      border-radius: 2px;
      opacity: 0;
      transition: opacity .3s ease, transform .3s ease;
      z-index: 3;
    }
    .eye::before { transform: translate(-2px, 0) rotate(0deg); }
    .eye::after { transform: translate(2px, 0) rotate(0deg); }
    .eyes-peek .eye:first-child { background: transparent; }
    .eyes-peek .eye:first-child .pupil { opacity: 0; }
    .eyes-peek .eye:first-child::before {
      opacity: 1;
      transform: translate(-2px, 1px) rotate(28deg);
    }
    .eyes-peek .eye:first-child::after {
      opacity: 1;
      transform: translate(2px, 1px) rotate(-28deg);
    }
    .char-purple { animation: float-1 4s ease-in-out infinite; }
    .char-orange { animation: float-2 5s ease-in-out infinite; }
    .char-yellow { animation: float-3 4.5s ease-in-out infinite; }
    .char-teal { animation: float-4 3.5s ease-in-out infinite; }
    @keyframes float-1 {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    @keyframes float-2 {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    @keyframes float-3 {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    @keyframes float-4 {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
    .login-form {
      width: 100%;
      max-width: 400px;
    }
    .login-form h1 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: .35rem;
      display: flex;
      align-items: center;
      gap: .45rem;
    }
    .star-icon {
      display: inline-flex;
      font-size: 1.1rem;
      animation: twinkle 2s ease-in-out infinite;
    }
    @keyframes twinkle {
      0%, 100% { opacity: 1; transform: scale(1) rotate(0deg); }
      50% { opacity: .6; transform: scale(.85) rotate(15deg); }
    }
    .login-form .subtitle {
      color: var(--text-secondary);
      font-size: .95rem;
      margin-bottom: 1.75rem;
    }
    .input-group {
      margin-bottom: 1rem;
      position: relative;
    }
    .input-group label {
      display: block;
      font-size: .82rem;
      font-weight: 600;
      margin-bottom: .4rem;
      color: var(--text-primary);
    }
    .input-group input {
      width: 100%;
      padding: .72rem .85rem;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      font-family: var(--font);
      font-size: .92rem;
      color: var(--text-primary);
      background: #fafafa;
      box-shadow: var(--shadow-input);
      transition: border-color var(--transition), box-shadow var(--transition), background var(--transition);
      outline: none;
    }
    .input-group input::placeholder { color: #b0b0b0; }
    .input-group input:hover {
      border-color: #c0c0c0;
      background: #fff;
    }
    .input-group input:focus {
      border-color: var(--border-focus);
      background: #fff;
      box-shadow: 0 0 0 3px rgba(26,26,26,.08);
    }
    .pw-wrapper { position: relative; }
    .pw-toggle {
      position: absolute;
      right: .75rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-secondary);
      font-size: 1.15rem;
      padding: 2px;
      display: flex;
      align-items: center;
      transition: color var(--transition);
    }
    .pw-toggle:hover { color: var(--text-primary); }
    .form-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
      font-size: .84rem;
    }
    .remember-label {
      display: flex;
      align-items: center;
      gap: .4rem;
      cursor: pointer;
      color: var(--text-secondary);
      user-select: none;
    }
    .remember-label input[type="checkbox"] {
      accent-color: var(--accent);
      width: 15px;
      height: 15px;
      cursor: pointer;
      border-radius: 4px;
    }
    .forgot-link {
      color: var(--text-primary);
      font-weight: 600;
      text-decoration: none;
      transition: color var(--transition);
    }
    .forgot-link:hover { color: var(--purple); }
    .btn {
      width: 100%;
      padding: .78rem 1rem;
      border-radius: var(--radius-sm);
      font-family: var(--font);
      font-size: .92rem;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .5rem;
    }
    .btn-primary {
      background: var(--accent);
      color: #fff;
      border: none;
      box-shadow: var(--shadow-btn);
    }
    .btn-primary:hover {
      background: #333;
      box-shadow: 0 4px 14px rgba(0,0,0,.15);
      transform: translateY(-1px);
    }
    .btn-primary:active { transform: translateY(0); }
    .btn-google {
      background: #fff;
      color: var(--text-primary);
      border: 1.5px solid var(--border);
      margin-top: .75rem;
    }
    .btn-google:hover {
      background: #f9f9f9;
      border-color: #c0c0c0;
      transform: translateY(-1px);
    }
    .btn-google:active { transform: translateY(0); }
    .btn-google svg { flex-shrink: 0; }
    .form-footer {
      text-align: center;
      margin-top: 1.75rem;
      font-size: .88rem;
      color: var(--text-secondary);
    }
    .form-footer a {
      color: var(--text-primary);
      font-weight: 600;
      text-decoration: none;
      transition: color var(--transition);
    }
    .form-footer a:hover { color: var(--purple); }
    .forms-container {
      width: 100%;
      max-width: 400px;
      position: relative;
      overflow: hidden;
    }
    .forms-slider {
      display: flex;
      width: 200%;
      transition: transform .45s cubic-bezier(.4,.0,.2,1);
    }
    .forms-slider.show-signup { transform: translateX(-50%); }
    .form-panel {
      width: 50%;
      flex-shrink: 0;
      padding: 0 2px;
    }
    .name-row {
      display: flex;
      gap: .6rem;
    }
    .name-row .input-group { flex: 1; }
    .name-row .input-group.middle-name { flex: 0.8; }
    .optional-tag {
      font-weight: 400;
      color: var(--text-secondary);
      font-size: .72rem;
    }
    @media (max-width: 900px) {
      .split { flex-direction: column; }
      .left-panel {
        min-height: 260px;
        flex: 0 0 auto;
        padding: 1.5rem;
      }
      .characters-scene { width: 320px; height: 260px; }
      .char-purple { width: 75px; height: 100px; left: 25px; bottom: 40px; border-radius: 14px; }
      .char-orange { width: 95px; height: 48px; right: 30px; bottom: 40px; }
      .char-yellow { width: 70px; height: 95px; left: 120px; bottom: 40px; }
      .char-teal { width: 55px; height: 55px; right: 55px; bottom: 105px; }
      .ground { bottom: 38px; }
      .right-panel { padding: 2rem 1.25rem; }
      .forms-container { max-width: 100%; }
    }
    @media (max-width: 480px) {
      .login-form h1, .signup-form h1 { font-size: 1.45rem; }
      .characters-scene { width: 280px; height: 220px; }
      .char-purple { width: 60px; height: 80px; left: 15px; bottom: 30px; }
      .char-orange { width: 80px; height: 40px; right: 15px; bottom: 30px; }
      .char-yellow { width: 58px; height: 80px; left: 100px; bottom: 30px; }
      .char-teal { width: 45px; height: 45px; right: 40px; bottom: 90px; }
      .ground { bottom: 28px; }
      .name-row { flex-direction: column; gap: 0; }
    }
  </style>
</head>
<body>
  <div class="split">
    <section class="left-panel" aria-label="Decorative mascot characters">
      <div class="characters-scene" id="scene">
        <div class="ground"></div>
        <div class="character char-purple" data-char>
          <div class="eyes" data-eyes>
            <div class="eye"><span class="pupil"></span></div>
            <div class="eye"><span class="pupil"></span></div>
          </div>
        </div>
        <div class="character char-yellow" data-char>
          <div class="eyes" data-eyes>
            <div class="eye"><span class="pupil"></span></div>
            <div class="eye"><span class="pupil"></span></div>
          </div>
        </div>
        <div class="character char-teal" data-char>
          <div class="eyes" data-eyes>
            <div class="eye"><span class="pupil"></span></div>
            <div class="eye"><span class="pupil"></span></div>
          </div>
        </div>
        <div class="character char-orange" data-char>
          <div class="eyes" data-eyes>
            <div class="eye"><span class="pupil"></span></div>
            <div class="eye"><span class="pupil"></span></div>
          </div>
        </div>
      </div>
    </section>
    <section class="right-panel">
      <div class="forms-container">
        <div class="forms-slider" id="formsSlider">
          <div class="form-panel">
            <form class="login-form" id="loginForm" autocomplete="off" novalidate>
              <h1>Welcome back! <span class="star-icon" aria-hidden="true">✦</span></h1>
              <p class="subtitle">Please enter your details.</p>
              <div class="input-group">
                <label for="loginEmail">Email</label>
                <input type="email" id="loginEmail" placeholder="Enter your email" />
              </div>
              <div class="input-group">
                <label for="loginPassword">Password</label>
                <div class="pw-wrapper">
                  <input type="password" id="loginPassword" class="pw-input" placeholder="••••••••" />
                  <button type="button" class="pw-toggle" data-pw-toggle="loginPassword" aria-label="Toggle password visibility">
                    <svg class="eye-icon-open" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                    <svg class="eye-icon-closed" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                  </button>
                </div>
              </div>
              <div class="form-row">
                <label class="remember-label">
                  <input type="checkbox" id="remember" />
                  Remember for 30 days
                </label>
                <a href="#" class="forgot-link" id="forgotLink">Forgot password?</a>
              </div>
              <button type="submit" class="btn btn-primary" id="loginBtn">Log in</button>
              <button type="button" class="btn btn-google" id="googleBtn">
                <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59a14.5 14.5 0 0 1 0-9.18l-7.98-6.19a24.01 24.01 0 0 0 0 21.56l7.98-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
                Log in with Google
              </button>
              <p class="form-footer">Don't have an account? <a href="#" id="signupLink">Sign up</a></p>
            </form>
          </div>
          <div class="form-panel">
            <form class="login-form signup-form" id="signupForm" autocomplete="off" novalidate>
              <h1>Create account <span class="star-icon" aria-hidden="true">✦</span></h1>
              <p class="subtitle">Fill in your details to get started.</p>
              <div class="name-row">
                <div class="input-group">
                  <label for="firstName">First name</label>
                  <input type="text" id="firstName" placeholder="John" required />
                </div>
                <div class="input-group middle-name">
                  <label for="middleName">Middle <span class="optional-tag">(optional)</span></label>
                  <input type="text" id="middleName" placeholder="—" />
                </div>
                <div class="input-group">
                  <label for="lastName">Last name</label>
                  <input type="text" id="lastName" placeholder="Doe" required />
                </div>
              </div>
              <div class="input-group">
                <label for="signupEmail">Email</label>
                <input type="email" id="signupEmail" placeholder="you@example.com" required />
              </div>
              <div class="input-group">
                <label for="signupPassword">Password</label>
                <div class="pw-wrapper">
                  <input type="password" id="signupPassword" class="pw-input" placeholder="••••••••" required />
                  <button type="button" class="pw-toggle" data-pw-toggle="signupPassword" aria-label="Toggle password visibility">
                    <svg class="eye-icon-open" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                    <svg class="eye-icon-closed" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                  </button>
                </div>
              </div>
              <div class="input-group">
                <label for="confirmPassword">Confirm password</label>
                <div class="pw-wrapper">
                  <input type="password" id="confirmPassword" class="pw-input" placeholder="••••••••" required />
                  <button type="button" class="pw-toggle" data-pw-toggle="confirmPassword" aria-label="Toggle confirm password visibility">
                    <svg class="eye-icon-open" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                    <svg class="eye-icon-closed" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                  </button>
                </div>
              </div>
              <button type="submit" class="btn btn-primary" id="signupBtn" style="margin-top:.5rem">Create account</button>
              <button type="button" class="btn btn-google" id="googleSignupBtn">
                <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59a14.5 14.5 0 0 1 0-9.18l-7.98-6.19a24.01 24.01 0 0 0 0 21.56l7.98-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
                Sign up with Google
              </button>
              <p class="form-footer">Already have an account? <a href="#" id="loginLink">Log in</a></p>
            </form>
          </div>
        </div>
      </div>
    </section>
  </div>
  <script>
    (()=>{
      'use strict';
      const allEyesDivs=document.querySelectorAll('[data-eyes]');
      const allPupils=document.querySelectorAll('.pupil');
      const formsSlider=document.getElementById('formsSlider');
      const loginForm=document.getElementById('loginForm');
      const signupForm=document.getElementById('signupForm');
      const signupLink=document.getElementById('signupLink');
      const loginLink=document.getElementById('loginLink');
      const allPwInputs=document.querySelectorAll('.pw-input');
      let peekActive=false;

      signupLink.addEventListener('click',e=>{
        e.preventDefault();
        formsSlider.classList.add('show-signup');
        setPeek(false);
        resetAllToggles();
      });
      loginLink.addEventListener('click',e=>{
        e.preventDefault();
        formsSlider.classList.remove('show-signup');
        setPeek(false);
        resetAllToggles();
      });

      document.querySelectorAll('.pw-toggle').forEach(btn=>{
        btn.addEventListener('mousedown',e=>e.preventDefault());
        btn.addEventListener('click',()=>{
          const input=document.getElementById(btn.dataset.pwToggle);
          const iconOpen=btn.querySelector('.eye-icon-open');
          const iconClosed=btn.querySelector('.eye-icon-closed');
          const isPassword=input.type==='password';
          input.type=isPassword?'text':'password';
          iconOpen.style.display=isPassword?'none':'block';
          iconClosed.style.display=isPassword?'block':'none';
          setPeek(!isPassword);
          input.focus();
        });
      });

      function resetAllToggles(){
        document.querySelectorAll('.pw-input').forEach(i=>{i.type='password';});
        document.querySelectorAll('.pw-toggle').forEach(b=>{
          b.querySelector('.eye-icon-open').style.display='block';
          b.querySelector('.eye-icon-closed').style.display='none';
        });
      }

      function setPeek(on){
        peekActive=on;
        allEyesDivs.forEach(d=>d.classList.toggle('eyes-peek',on));
      }

      const MAX_OFFSET=3.5;
      function movePupils(cx,cy){
        allPupils.forEach(p=>{
          if(peekActive&&p.closest('.eye:first-child'))return;
          const e=p.parentElement;
          const r=e.getBoundingClientRect();
          const ex=r.left+r.width/2;
          const ey=r.top+r.height/2;
          const dx=cx-ex,dy=cy-ey;
          const a=Math.atan2(dy,dx);
          const d=Math.min(Math.hypot(dx,dy)*0.04,MAX_OFFSET);
          p.style.transform=`translate(${Math.cos(a)*d}px,${Math.sin(a)*d}px)`;
        });
      }

      document.addEventListener('mousemove',e=>movePupils(e.clientX,e.clientY));
      document.addEventListener('touchmove',e=>{
        if(e.touches.length)movePupils(e.touches[0].clientX,e.touches[0].clientY);
      },{passive:true});

      allPwInputs.forEach(input=>{
        input.addEventListener('focus',()=>setPeek(true));
        input.addEventListener('blur',()=>{if(input.type==='password')setPeek(false);});
      });

      loginForm.addEventListener('submit',e=>{
        e.preventDefault();
        const btn=document.getElementById('loginBtn');
        btn.textContent='Logging in…';
        setTimeout(()=>{btn.textContent='Log in';},1500);
      });
      signupForm.addEventListener('submit',e=>{
        e.preventDefault();
        const btn=document.getElementById('signupBtn');
        btn.textContent='Creating…';
        setTimeout(()=>{btn.textContent='Create account';},1500);
      });
    })();
  </script>
</body>
</html>
